# Publica a imagem do MVP no GitHub Container Registry (ghcr.io) seguindo o GitFlow.
# Copie para .github/workflows/ do repositório do MVP. Mesma regra do pipeline do hub (build/versao-gitflow.sh):
#
#   feature/*                     só build de teste (PR), não publica
#   develop                       ghcr.io/<conta>/<repo>:develop-<commit>  + :develop (móvel)   → homologação
#   release/X.Y.Z, hotfix/X.Y.Z   ghcr.io/<conta>/<repo>:X.Y.Z-rc.<n>                          → homologação
#   tag vX.Y ou vX.Y.Z (main)     ghcr.io/<conta>/<repo>:X.Y(.Z)                               → produção
#
# No Dokploy: produção com MVP_IMAGE=ghcr.io/<conta>/<repo>:X.Y.Z (sempre fixa); homologação pode usar :develop.
# Versão, commit e repositório vão gravados na imagem (APP_VERSION, APP_COMMIT, APP_REPOSITORY) para o manifesto: o hub
# mostra cada versão com o link do commit e consegue voltar para uma anterior trocando só o MVP_IMAGE.
name: Publicar imagem

on:
  push:
    branches: [develop, "release/**", "hotfix/**"]
    tags: ["v*"]
  pull_request:
    branches: [develop, main, "release/**", "hotfix/**"]

permissions:
  contents: read
  packages: write

jobs:
  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versão (GitFlow)
        id: v
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          sha="${GITHUB_SHA::7}"; ref="$GITHUB_REF"; nome="${GITHUB_REF#refs/heads/}"
          semver='^[0-9]+\.[0-9]+(\.[0-9]+)?$'
          publicar=nao; versao="pr-$sha"; movel=""
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ "$ref" == refs/tags/v* && "${ref#refs/tags/v}" =~ $semver ]]; then
              publicar=sim; versao="${ref#refs/tags/v}"
            elif [[ "$nome" == release/* || "$nome" == hotfix/* ]]; then
              if [[ "${nome#*/}" =~ $semver ]]; then publicar=sim; versao="${nome#*/}-rc.$GITHUB_RUN_NUMBER"
              else echo "::warning::use release/X.Y.Z ou hotfix/X.Y.Z (recebido: $nome) — imagem não publicada"; fi
            elif [[ "$nome" == develop ]]; then
              publicar=sim; versao="develop-$sha"; movel="develop"
            fi
          fi
          tags="$repo:$versao"; [[ -n "$movel" ]] && tags="$tags,$repo:$movel"
          echo "publicar=$publicar" >> "$GITHUB_OUTPUT"
          echo "version=$versao" >> "$GITHUB_OUTPUT"
          echo "image=$repo:$versao" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        if: steps.v.outputs.publicar == 'sim'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.v.outputs.publicar == 'sim' }}
          tags: ${{ steps.v.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.v.outputs.version }}
            APP_COMMIT=${{ github.sha }}
            APP_REPOSITORY=${{ github.server_url }}/${{ github.repository }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Resumo
        run: |
          if [[ "${{ steps.v.outputs.publicar }}" == "sim" ]]; then
            echo "Imagem publicada: \`${{ steps.v.outputs.image }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "No Dokploy: \`MVP_IMAGE=${{ steps.v.outputs.image }}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Build de verificação (não publica nesta branch)." >> "$GITHUB_STEP_SUMMARY"
          fi
