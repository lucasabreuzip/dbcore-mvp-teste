# Publica a imagem do MVP no GitHub Container Registry (ghcr.io) seguindo o GitFlow, só com PRODUÇÃO.
# Copie para .github/workflows/ do repositório do MVP. Mesma regra do pipeline do hub (build/versao-gitflow.sh):
#
#   feature/*, develop, release/*, hotfix/*, PRs   só build de verificação (não publica)
#   tag vX.Y ou vX.Y.Z na main                     ghcr.io/<conta>/<repo>:X.Y(.Z)   → produção
#                                                  canal "hotfix" se a tag é o merge de um hotfix, senão "release"
#
# No Dokploy: MVP_IMAGE=ghcr.io/<conta>/<repo>:X.Y.Z (sempre a versão fixa). Versão, canal, commit e repositório vão
# gravados na imagem (APP_VERSION, APP_CHANNEL, APP_COMMIT, APP_REPOSITORY) para o manifesto: o hub mostra cada versão
# com o selo (release ou hotfix) e o link do commit, e consegue voltar para uma anterior trocando só o MVP_IMAGE.
name: Publicar imagem

on:
  push:
    branches: [develop, "release/**", "hotfix/**"]
    tags: ["v*"]
  pull_request:
    branches: [develop, main, "release/**", "hotfix/**"]

permissions:
  contents: read
  packages: write

jobs:
  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versão (GitFlow)
        id: v
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          semver='^[0-9]+\.[0-9]+(\.[0-9]+)?$'
          publicar=nao; versao="verificacao-${GITHUB_SHA::7}"; canal=""
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" =~ $semver ]]; then
            publicar=sim; versao="${GITHUB_REF#refs/tags/v}"; canal=release
            # Tag criada no merge de um hotfix ("Merge hotfix/…", "Merge branch 'hotfix/…'", PR "…/hotfix/…").
            if git log -1 --pretty=%s | grep -Eq "(^|[ '/])hotfix/"; then canal=hotfix; fi
          fi
          echo "publicar=$publicar" >> "$GITHUB_OUTPUT"
          echo "version=$versao" >> "$GITHUB_OUTPUT"
          echo "channel=$canal" >> "$GITHUB_OUTPUT"
          echo "image=$repo:$versao" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        if: steps.v.outputs.publicar == 'sim'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.v.outputs.publicar == 'sim' }}
          tags: ${{ steps.v.outputs.image }}
          build-args: |
            APP_VERSION=${{ steps.v.outputs.version }}
            APP_CHANNEL=${{ steps.v.outputs.channel }}
            APP_COMMIT=${{ github.sha }}
            APP_REPOSITORY=${{ github.server_url }}/${{ github.repository }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Resumo
        run: |
          if [[ "${{ steps.v.outputs.publicar }}" == "sim" ]]; then
            echo "Imagem publicada (${{ steps.v.outputs.channel }}): \`${{ steps.v.outputs.image }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "No Dokploy: \`MVP_IMAGE=${{ steps.v.outputs.image }}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Build de verificação: só a tag vX.Y.Z na main publica imagem (produção)." >> "$GITHUB_STEP_SUMMARY"
          fi
